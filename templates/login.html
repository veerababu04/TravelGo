{% extends 'base.html' %}

{% block content %}
<style>
    .login-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
    }
    .theme-icons {
        font-size: 2rem;
        margin-bottom: 20px;
        color: #007bff;
    }
    .theme-icons i {
        margin: 0 10px;
    }
    .form-control {
        margin-bottom: 15px;
        border-radius: 20px;
    }
    .btn-login {
        width: 100%;
        border-radius: 20px;
        background: linear-gradient(45deg, #007bff, #00d2ff);
        border: none;
        color: white;
        padding: 10px;
    }
</style>

<div class="login-container">
    <div class="theme-icons">
        <i class="fas fa-plane"></i>
        <i class="fas fa-train"></i>
        <i class="fas fa-bus"></i>
    </div>
    <h3>TravelGo Login</h3>
    <p class="text-muted">Mee prayanam ikkada modalavuthundi</p>
    
    <form method="POST">
        <div class="form-group">
            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-login">Login</button>
    </form>
    
    <div class="mt-3">
        <small><a href="#">Forgot Password?</a> | <a href="#">Create Account</a></small>
    </div>
</div>
{% endblock %}
