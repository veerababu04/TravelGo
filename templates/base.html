<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}TravelGo{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --navy:    #0a1628;
      --navy2:   #102040;
      --teal:    #0ea5e9;
      --teal2:   #38bdf8;
      --orange:  #f97316;
      --white:   #f8fafc;
      --muted:   #94a3b8;
      --border:  rgba(255,255,255,.08);
      --card:    rgba(255,255,255,.04);
      --font:    'Plus Jakarta Sans', sans-serif;
      --radius:  12px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { font-family:var(--font); background:var(--navy); color:var(--white); min-height:100vh; }

    /* Navbar */
    nav {
      background: rgba(10,22,40,.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 5%;
      display: flex; align-items: center; justify-content: space-between;
      height: 62px; position: sticky; top:0; z-index:200;
    }
    .brand { font-size:1.3rem; font-weight:800; color:var(--white); text-decoration:none; display:flex; align-items:center; gap:8px; }
    .brand span { color:var(--teal); }
    .brand i { color:var(--orange); font-size:1.1rem; }
    .nav-links { display:flex; gap:6px; list-style:none; }
    .nav-links a {
      font-size:.85rem; font-weight:600; color:var(--muted);
      text-decoration:none; padding:7px 14px; border-radius:6px;
      transition:.2s;
    }
    .nav-links a:hover, .nav-links a.active { color:var(--white); background:rgba(255,255,255,.07); }

    /* Page content */
    .page { padding: 40px 5%; }

    /* Cards */
    .card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius); padding:24px;
    }
    .card:hover { border-color:rgba(14,165,233,.3); }

    /* Buttons */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 22px; border-radius:8px; font-family:var(--font); font-size:.88rem; font-weight:600; border:none; cursor:pointer; transition:all .2s; text-decoration:none; }
    .btn-teal  { background:var(--teal);  color:#fff; }
    .btn-teal:hover  { background:var(--teal2); transform:translateY(-1px); }
    .btn-orange{ background:var(--orange); color:#fff; }
    .btn-orange:hover{ opacity:.9; transform:translateY(-1px); }
    .btn-ghost { background:transparent; color:var(--teal); border:1px solid rgba(14,165,233,.4); }
    .btn-ghost:hover { background:rgba(14,165,233,.1); }
    .btn-red   { background:#ef4444; color:#fff; }
    .btn-red:hover   { background:#dc2626; }

    /* Form inputs */
    .form-group { display:flex; flex-direction:column; gap:6px; }
    .form-group label { font-size:.8rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .form-control {
      background:rgba(255,255,255,.06);
      border:1px solid var(--border);
      border-radius:8px; padding:10px 14px;
      color:var(--white); font-family:var(--font); font-size:.92rem;
      transition:border-color .2s; outline:none;
    }
    .form-control:focus { border-color:var(--teal); }
    .form-control option { background:#0a1628; }

    /* Badge */
    .badge {
      display:inline-block; padding:3px 10px; border-radius:20px;
      font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    }
    .badge-teal  { background:rgba(14,165,233,.15); color:var(--teal);  border:1px solid rgba(14,165,233,.3); }
    .badge-orange{ background:rgba(249,115,22,.15);  color:var(--orange);border:1px solid rgba(249,115,22,.3); }
    .badge-green { background:rgba(34,197,94,.15);   color:#22c55e;       border:1px solid rgba(34,197,94,.3); }

    /* Divider */
    .divider { height:1px; background:var(--border); margin:24px 0; }

    /* Alert */
    .alert { padding:14px 18px; border-radius:8px; font-size:.9rem; margin-bottom:20px; }
    .alert-success { background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.3); color:#86efac; }

    footer {
      text-align:center; padding:28px;
      font-size:.8rem; color:var(--muted);
      border-top:1px solid var(--border);
    }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>
  <nav>
    <a class="brand" href="/"><i class="fas fa-paper-plane"></i> Travel<span>Go</span></a>
    <ul class="nav-links">
      <li><a href="/" {% if request.path=='/' %}class="active"{% endif %}>🏠 Home</a></li>
      <li><a href="/my-bookings" {% if request.path=='/my-bookings' %}class="active"{% endif %}>🎫 My Bookings</a></li>
    </ul>
  </nav>

  {% block content %}{% endblock %}

  <footer>© 2025 TravelGo · Made with ❤️ by Veera Babu N</footer>
</body>
</html>
